openapi: 3.0.3
info:
  title: UNO Game Server API
  version: 1.0.0
  description: |
    A UNO card game server written in Go. Manages rooms, player hands, and game actions.
    Game state is persisted as JSON files per room (`<roomID>.json` for cards, `<roomID>.data.json` for action state).

    Current behavior:
    - JSON bodies are written without setting a Content-Type header, so responses
      are actually served as `text/plain; charset=utf-8` even though the body is JSON text.
    - JSON error responses use the envelope:
      {"error": "<message>", "status": "bad", "resp": ""}
    - HTTP status is 200 even on errors.
    - `/action` returns an empty body on success.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /ping:
    get:
      summary: Health check
      description: Returns "pong" followed by a newline.
      operationId: ping
      responses:
        '200':
          description: Server is running
          content:
            text/plain:
              schema:
                type: string
              examples:
                pong:
                  value: "pong\n"
  /newRoom:
    get:
      summary: Create a new UNO room and deal cards
      description: |
        Creates a new game room for 2-4 players. Each active player is dealt 7 cards.
        A random integer in [0, 999] is used as the room ID. The first non-Wild card
        drawn from the remaining deck is used as the initial `lastCard` and is removed
        from the deck. The number of players is stored in the action data (`players`).
      operationId: newRoom
      parameters:
        - in: query
          name: pep
          required: true
          schema:
            type: integer
            minimum: 2
            maximum: 4
          description: Number of players
      responses:
        '200':
          description: |
            Room created, player number invalid, or `pep` missing/non-numeric.
          content:
            text/plain:
              schema:
                type: string
                description: JSON text.
              examples:
                created:
                  summary: Room created successfully (`resp` is the new room ID)
                  value: '{"error":"","status":"ok","resp":"405"}'
                invalidPlayer:
                  summary: Invalid player number
                  value: '{"error":"Invalid Player Number","status":"bad","resp":""}'
                invalidParam:
                  summary: Missing or non-numeric `pep`
                  value: '{"error":"strconv.Atoi: parsing \"\": invalid syntax","status":"bad","resp":""}'
  /fetchPlayerCards:
    get:
      summary: Get a player's cards
      description: |
        Returns the card IDs held by the specified player. `resp` is a string
        containing Go's representation of an integer slice, e.g. `[202 303 405]`.
      operationId: fetchPlayerCards
      parameters:
        - in: query
          name: roomID
          required: true
          schema:
            type: integer
          description: Room ID
        - in: query
          name: playerID
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 4
          description: Player ID (1-4)
      responses:
        '200':
          description: Player's cards returned, player ID invalid, or the room file could not be read.
          content:
            text/plain:
              schema:
                type: string
                description: JSON text.
              examples:
                success:
                  summary: Player cards returned
                  value: '{"error":"","status":"ok","resp":"[202 303 405 407 103 111 400]"}'
                invalidPlayer:
                  summary: Incorrect player ID
                  value: '{"error":"Incorrect Player ID","status":"bad","resp":""}'
                roomNotFound:
                  summary: Room file not found
                  value: '{"error":"open 999.json: no such file or directory","status":"bad","resp":""}'
                invalidParam:
                  summary: Missing or non-numeric parameter
                  value: '{"error":"strconv.Atoi: parsing \"\": invalid syntax","status":"bad","resp":""}'
  /fetchAction:
    get:
      summary: Get current game action state
      description: |
        Returns the room's action data as a string produced by Go's `fmt.Sprint`
        on the `GameActionData` struct, in this field order:
        `{ban plusTwo color clockWise turn lastCard plusFour players}`.
        `color` is the currently active color (1 Red, 2 Yellow, 3 Blue, 4 Green);
        it is updated when a colored card is played and when a Wild / +4 is played
        with a `color` argument.
        `plusTwo` / `plusFour` hold the accumulated draw penalty waiting for the
        next player to stack or draw.
      operationId: fetchAction
      parameters:
        - in: query
          name: roomID
          required: true
          schema:
            type: integer
          description: Room ID
      responses:
        '200':
          description: Game action data returned, or the room data file was not found.
          content:
            text/plain:
              schema:
                type: string
                description: JSON text; on success `resp` contains the `fmt.Sprint` rendering of the action data.
              examples:
                success:
                  summary: Current game action data
                  value: '{"error":"","status":"ok","resp":"{false 0 2 true 1 223 0 2}"}'
                roomNotFound:
                  summary: Room data file not found
                  value: '{"error":"open 999.data.json: no such file or directory","status":"bad","resp":""}'
                invalidParam:
                  summary: Missing or non-numeric `roomID`
                  value: '{"error":"strconv.Atoi: parsing \"\": invalid syntax","status":"bad","resp":""}'
  /action:
    get:
      summary: Play a card / perform a game action
      description: |
        Validates and processes a card play for the given player in the room.
        Checks whose turn it is, card ownership, and legality, then updates the
        hand, the active color, the accumulated draw penalty, and the turn.
        On success the response is HTTP 200 with an empty body.

        Special card behavior:
        - `card=1000` means Pass/Skip: no card is played, `lastCard` is unchanged,
          and the turn advances. If a +2 / +4 penalty is pending, the player draws
          the accumulated cards and the penalty is cleared.
        - Skip (`N21` / `N31`) advances the turn by two players.
        - Reverse (`N22` / `N32`) flips the direction; with two players it acts
          like Skip.
        - +2 (`N23` / `N33`) adds 2 to `plusTwo`; the next player must stack a +2
          of the same active color or Pass (`card=1000`) to draw the penalty.
        - +4 (`511`-`514`) adds 4 to `plusFour`; the next player must stack another
          +4 or Pass to draw the penalty.
        - Wild (`521`-`524`) and +4 set the active color from the optional `color`
          parameter (or keep the current color if omitted).
      operationId: playAction
      parameters:
        - in: query
          name: roomID
          required: true
          schema:
            type: integer
          description: Room ID
        - in: query
          name: player
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 4
          description: Player ID (1-4)
        - in: query
          name: card
          required: true
          schema:
            type: integer
          description: Card ID to play, or `1000` to Pass/Skip.
        - in: query
          name: color
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4
          description: New active color when playing a Wild / +4 (1 Red, 2 Yellow, 3 Blue, 4 Green).
      responses:
        '200':
          description: |
            Action processed (empty body) or an error returned as JSON text.
          content:
            text/plain:
              schema:
                type: string
                description: Empty on success; JSON text on error.
              examples:
                success:
                  summary: Card played successfully (empty body)
                  value: ''
                pass:
                  summary: Pass/Skip processed (empty body)
                  value: ''
                invalidParam:
                  summary: Missing or non-numeric parameter
                  value: '{"error":"strconv.Atoi: parsing \"\": invalid syntax","status":"bad","resp":""}'
                invalidColor:
                  summary: Color outside 1-4
                  value: '{"error":"Color must be 1-4","status":"bad","resp":""}'
                cardNotLegal:
                  summary: Card not legal
                  value: '{"error":"Card Not Legal","status":"bad","resp":""}'
                cardNotFoundInPlayer:
                  summary: Card not found in player
                  value: '{"error":"Card Not Found in player","status":"bad","resp":""}'
                illegalCard:
                  summary: Card ID is not in the deck
                  value: '{"error":"Illegal card ID","status":"bad","resp":""}'
                mustStackTwo:
                  summary: A +2 penalty is pending and the card is not a matching +2
                  value: '{"error":"Must stack +2 or pass","status":"bad","resp":""}'
                mustStackFour:
                  summary: A +4 penalty is pending and the card is not a +4
                  value: '{"error":"Must stack +4 or pass","status":"bad","resp":""}'
                notYourTurn:
                  summary: Not the player's turn
                  value: '{"error":"Not your turn","status":"bad","resp":""}'
                roomNotFound:
                  summary: Room file not found
                  value: '{"error":"open 0.json: no such file or directory","status":"bad","resp":""}'
components:
  schemas:
    GameActionData:
      type: object
      description: |
        Logical fields of `<roomID>.data.json`. `/fetchAction` returns this struct
        via `fmt.Sprint`, not as a JSON object.
      properties:
        ban:
          type: boolean
          description: Reserved. Initialized to false and not used; Skip is implemented by advancing `turn`.
          example: false
        plusTwo:
          type: integer
          description: Accumulated +2 draw penalty. Reset to 0 when the penalized player draws.
          example: 0
        color:
          type: integer
          description: |
            Currently active color (1 Red, 2 Yellow, 3 Blue, 4 Green).
            Set from `lastCard` at room creation, updated when a colored card is
            played, and set by Wild / +4 using the `color` argument.
          example: 1
        clockWise:
          type: boolean
          description: Play direction. `true` is clockwise; toggled by Reverse.
          example: true
        turn:
          type: integer
          description: Current player's turn (1-4).
          example: 1
        lastCard:
          type: integer
          description: The last played card ID. Pass (`1000`) does not change it.
          example: 105
        plusFour:
          type: integer
          description: Accumulated +4 draw penalty. Reset to 0 when the penalized player draws.
          example: 0
        players:
          type: integer
          description: Number of players in the room (2-4).
          example: 4
