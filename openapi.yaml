openapi: 3.0.3
info:
  title: UNO Game Server API
  version: 1.2.0
  description: |
    A UNO card game server written in Go. Manages rooms, player hands, the deck,
    and game actions. Game state is persisted as JSON files per room
    (`<roomID>.json` for cards, `<roomID>.data.json` for action state).

    Responses:
    - Every API endpoint returns the unified JSON envelope
      `{"error": "", "status": "ok", "resp": "..."}` on success or
      `{"error": "<message>", "status": "bad", "resp": ""}` on failure.
    - `Content-Type` is always `application/json; charset=utf-8`.
    - HTTP status codes are meaningful:
      `200` success, `400` invalid parameters / illegal action,
      `404` room not found, `409` game already over (a `winner` exists).

    Card ID format:
    - Colors: 1xx Red, 2xx Yellow, 3xx Blue, 4xx Green, 5xx Wild/+4.
    - `N00` is 0, `N01`-`N09` / `N11`-`N19` are 1-9.
    - Skip: `N21` / `N31`; Reverse: `N22` / `N32`; Draw 2: `N23` / `N33`.
    - +4: `511`-`514`; Wild: `521`-`524`.
    - `1000` is the virtual draw/pass action: the first use draws a card, a
      second use passes the turn.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /ping:
    get:
      summary: Health check
      description: Returns `pong` in the unified JSON envelope.
      operationId: ping
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: ''
                status: ok
                resp: pong
  /newRoom:
    get:
      summary: Create a new UNO room and deal cards
      description: |
        Creates a new game room for 2-4 players. Each active player is dealt 7 cards.
        A random integer in [0, 999] is used as the room ID. The first non-Wild card
        drawn from the remaining deck becomes the initial `lastCard` and is removed
        from the deck. The player count is stored in the action data (`players`).
      operationId: newRoom
      parameters:
        - in: query
          name: pep
          required: true
          schema:
            type: integer
            minimum: 2
            maximum: 4
          description: Number of players
      responses:
        '200':
          description: Room created successfully; `resp` is the new room ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: ''
                status: ok
                resp: '405'
        '400':
          description: Invalid or missing `pep`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                invalidPlayer:
                  value:
                    error: Invalid Player Number
                    status: bad
                    resp: ''
                invalidParam:
                  value:
                    error: 'strconv.Atoi: parsing "": invalid syntax'
                    status: bad
                    resp: ''
  /fetchPlayerCards:
    get:
      summary: Get a player's cards
      description: |
        Returns the card IDs held by the specified player. `resp` is a string
        containing Go's representation of an integer slice, e.g. `[202 303 405]`.
      operationId: fetchPlayerCards
      parameters:
        - in: query
          name: roomID
          required: true
          schema:
            type: integer
          description: Room ID
        - in: query
          name: playerID
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 4
          description: Player ID (1-4)
      responses:
        '200':
          description: Player's cards returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: ''
                status: ok
                resp: '[202 303 405 407 103 111 400]'
        '400':
          description: Invalid player ID or missing/non-numeric parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                invalidPlayer:
                  value:
                    error: Incorrect Player ID
                    status: bad
                    resp: ''
                invalidParam:
                  value:
                    error: 'strconv.Atoi: parsing "": invalid syntax'
                    status: bad
                    resp: ''
        '404':
          description: Room file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: 'open 999.json: no such file or directory'
                status: bad
                resp: ''
  /fetchAction:
    get:
      summary: Get current game action state
      description: |
        Returns the room's action data as a string produced by Go's `fmt.Sprint`
        on the `GameActionData` struct, in this field order:
        `{ban plusTwo color clockWise turn lastCard plusFour players winner hasDrawn}`.

        - `color` is the currently active color (1 Red, 2 Yellow, 3 Blue, 4 Green).
        - `plusTwo` / `plusFour` hold the accumulated draw penalty.
        - `winner` is 1-4 once a player has emptied their hand, otherwise 0.
        - `hasDrawn` is true when the current player has already drawn this turn.
      operationId: fetchAction
      parameters:
        - in: query
          name: roomID
          required: true
          schema:
            type: integer
          description: Room ID
      responses:
        '200':
          description: Game action data returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: ''
                status: ok
                resp: '{false 0 2 true 1 223 0 2 0 false}'
        '400':
          description: Missing or non-numeric `roomID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: 'strconv.Atoi: parsing "": invalid syntax'
                status: bad
                resp: ''
        '404':
          description: Room data file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: 'open 999.data.json: no such file or directory'
                status: bad
                resp: ''
  /getCardFromRepo:
    get:
      summary: Draw a card from the deck
      description: |
        Draws one card from the room's deck, appends it to the player's hand, and
        writes the updated state back to disk (setting `hasDrawn`). The player may
        then play the drawn card with `/action`, or Pass with `card=1000`.

        Each player may draw at most once per turn; calling this again before the
        turn advances returns `Already drew a card this turn`.
        Requires that it is the player's turn, that the game is not over, and that
        no `+2` / `+4` penalty is pending (the player must stack or pass instead).
        If the deck is empty, it is rebuilt from the full card set by removing all
        cards currently held by players and the current `lastCard`, then shuffled.
      operationId: getCardFromRepo
      parameters:
        - in: query
          name: roomID
          required: true
          schema:
            type: integer
          description: Room ID
        - in: query
          name: player
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 4
          description: Player ID (1-4)
      responses:
        '200':
          description: Card drawn; `resp` is the drawn card ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: ''
                status: ok
                resp: '201'
        '400':
          description: Invalid parameters, not the player's turn, or a penalty is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                notYourTurn:
                  value:
                    error: Not your turn
                    status: bad
                    resp: ''
                penaltyPending:
                  value:
                    error: Must stack or pass
                    status: bad
                    resp: ''
                alreadyDrew:
                  value:
                    error: Already drew a card this turn
                    status: bad
                    resp: ''
                invalidParam:
                  value:
                    error: 'strconv.Atoi: parsing "": invalid syntax'
                    status: bad
                    resp: ''
        '404':
          description: Room file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: 'open 999.json: no such file or directory'
                status: bad
                resp: ''
        '409':
          description: Game already has a winner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: Game Over
                status: bad
                resp: ''
  /action:
    get:
      summary: Play a card / pass
      description: |
        Validates and processes a card play for the given player. Checks whose turn
        it is, card ownership, and legality, then updates the hand, active color,
        draw penalty, turn, and winner. On success the envelope has an empty `resp`.

        Special card behavior:
        - `card=1000` is the draw/pass action. On the first use in a turn the
          player draws one card (returned in `resp`), the turn does NOT advance,
          and the player may then play a card or use `1000` again. On the second
          use the turn advances and `lastCard` is unchanged. If a +2 / +4 penalty
          is pending, `1000` draws the accumulated penalty cards, clears the
          penalty, and ends the turn.
        - Skip (`N21` / `N31`) advances the turn by two players.
        - Reverse (`N22` / `N32`) flips the direction; with two players it acts
          like Skip.
        - +2 (`N23` / `N33`) adds 2 to `plusTwo`. The next player must stack any
          +2 (color does not matter) or Pass to draw the penalty. +2 and +4 cannot
          stack on each other.
        - +4 (`511`-`514`) adds 4 to `plusFour`. The next player must stack another
          +4 or Pass to draw the penalty.
        - Wild (`521`-`524`) and +4 set the active color from `choseColor`
          (or keep the current color if omitted).
        - When a player empties their hand, `winner` is set to that player ID and
          further actions return `409`.
      operationId: playAction
      parameters:
        - in: query
          name: roomID
          required: true
          schema:
            type: integer
          description: Room ID
        - in: query
          name: player
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 4
          description: Player ID (1-4)
        - in: query
          name: card
          required: true
          schema:
            type: integer
          description: Card ID to play, or `1000` to draw/pass.
        - in: query
          name: choseColor
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4
          description: New active color when playing a Wild / +4 (1 Red, 2 Yellow, 3 Blue, 4 Green).
      responses:
        '200':
          description: Action processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                played:
                  summary: Card played or turn passed
                  value:
                    error: ''
                    status: ok
                    resp: ''
                drewCard:
                  summary: First `card=1000` in a turn draws a card
                  value:
                    error: ''
                    status: ok
                    resp: '101'
        '400':
          description: Invalid parameters or illegal action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                invalidParam:
                  value:
                    error: 'strconv.Atoi: parsing "": invalid syntax'
                    status: bad
                    resp: ''
                invalidColor:
                  value:
                    error: choseColor must be 1-4
                    status: bad
                    resp: ''
                cardNotLegal:
                  value:
                    error: Card Not Legal
                    status: bad
                    resp: ''
                cardNotFoundInPlayer:
                  value:
                    error: Card Not Found in player
                    status: bad
                    resp: ''
                illegalCard:
                  value:
                    error: Illegal card ID
                    status: bad
                    resp: ''
                mustStackTwo:
                  value:
                    error: Must stack +2 or pass
                    status: bad
                    resp: ''
                mustStackFour:
                  value:
                    error: Must stack +4 or pass
                    status: bad
                    resp: ''
                notYourTurn:
                  value:
                    error: Not your turn
                    status: bad
                    resp: ''
        '404':
          description: Room file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: 'open 0.json: no such file or directory'
                status: bad
                resp: ''
        '409':
          description: Game already has a winner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                error: Game Over
                status: bad
                resp: ''
components:
  schemas:
    Response:
      type: object
      description: Unified response envelope returned by every endpoint.
      required:
        - error
        - status
        - resp
      properties:
        error:
          type: string
          description: Error message; empty on success.
          example: ''
        status:
          type: string
          enum:
            - ok
            - bad
          description: Logical result of the request.
          example: ok
        resp:
          type: string
          description: Payload as a string; empty on error.
          example: ''
    GameActionData:
      type: object
      description: |
        Logical fields of `<roomID>.data.json`. `/fetchAction` returns this struct
        via `fmt.Sprint`, not as a JSON object.
      properties:
        ban:
          type: boolean
          description: Reserved. Initialized to false and not used; Skip advances `turn`.
          example: false
        plusTwo:
          type: integer
          description: Accumulated +2 draw penalty. Reset to 0 when the penalized player draws.
          example: 0
        color:
          type: integer
          description: |
            Currently active color (1 Red, 2 Yellow, 3 Blue, 4 Green).
            Set from `lastCard` at room creation, updated when a colored card is
            played, and set by Wild / +4 using `choseColor`.
          example: 1
        clockWise:
          type: boolean
          description: Play direction. `true` is clockwise; toggled by Reverse.
          example: true
        turn:
          type: integer
          description: Current player's turn (1-4).
          example: 1
        lastCard:
          type: integer
          description: The last played card ID. Pass (`1000`) does not change it.
          example: 105
        plusFour:
          type: integer
          description: Accumulated +4 draw penalty. Reset to 0 when the penalized player draws.
          example: 0
        players:
          type: integer
          description: Number of players in the room (2-4).
          example: 4
        winner:
          type: integer
          description: |
            Winning player ID (1-4), or 0 while the game is running. The deck is a
            special player ID (6) and is never a winner.
          example: 0
        hasDrawn:
          type: boolean
          description: |
            True when the current player has already drawn a card this turn.
            Reset when the turn advances.
          example: false
